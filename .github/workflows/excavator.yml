name: excavator
on:
  schedule:
    # Hourly — picks up sibling releases when FLEET_BUCKET_TOKEN dispatch is unset
    - cron: "0 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [fleet-release]
permissions:
  contents: write
jobs:
  excavate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: krate-apps/fleet-bucket-action/excavate@main
        with:
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          git-name: ${{ secrets.GIT_NAME }}
          git-email: ${{ secrets.GIT_EMAIL }}
